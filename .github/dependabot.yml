# Keeps the GitHub Actions used in .github/workflows up to date.
# Once a month, Dependabot checks for new versions and opens one pull request
# with all of the updates. Read it, check the deploy still passes, then merge.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
